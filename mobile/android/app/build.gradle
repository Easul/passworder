plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def targetAbi = System.getenv('TARGET_ABI') ?: project.findProperty('targetAbi')
def buildVersionCodeOverride = System.getenv('BUILD_VERSION_CODE') ?: project.findProperty('buildVersionCode')
def buildVersionLabel = System.getenv('BUILD_VERSION_LABEL') ?: project.findProperty('buildVersionLabel')
def releaseKeystorePath = System.getenv('ANDROID_KEYSTORE_PATH') ?: project.findProperty('androidKeystorePath')
def releaseKeystorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: project.findProperty('androidKeystorePassword')
def releaseKeyAlias = System.getenv('ANDROID_KEY_ALIAS') ?: project.findProperty('androidKeyAlias')
def releaseKeyPassword = System.getenv('ANDROID_KEY_PASSWORD') ?: project.findProperty('androidKeyPassword')
def localServerListenHost = System.getenv('LOCAL_SERVER_LISTEN_HOST') ?: project.findProperty('localServerListenHost') ?: '127.0.0.1'
def hasReleaseKeystore = releaseKeystorePath != null && releaseKeystorePath.toString().trim() &&
        releaseKeystorePassword != null && releaseKeystorePassword.toString().trim() &&
        releaseKeyAlias != null && releaseKeyAlias.toString().trim() &&
        releaseKeyPassword != null && releaseKeyPassword.toString().trim()
def versionCodeOffset = 5000
def fallbackVersionCode = { ->
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'rev-list', '--count', 'main'
            standardOutput = stdout
        }
        return versionCodeOffset + stdout.toString().trim().toInteger()
    } catch (Exception ignored) {
        return versionCodeOffset + 1
    }
}
def androidVersionCode = buildVersionCodeOverride != null && buildVersionCodeOverride.toString().trim() ? buildVersionCodeOverride.toString().toInteger() : fallbackVersionCode()
def androidVersionName = buildVersionLabel != null && buildVersionLabel.toString().trim() ? buildVersionLabel.toString() : "1.0+dev"

android {
    namespace 'com.passworder'
    compileSdk 34

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.passworder"
        minSdk 24
        targetSdk 34
        versionCode androidVersionCode
        versionName androidVersionName
        buildConfigField "String", "LOCAL_SERVER_LISTEN_HOST", "\"${localServerListenHost.toString()}\""
        buildConfigField "String", "LOCAL_SERVER_WEB_HOST", '"127.0.0.1"'
        buildConfigField "int", "LOCAL_SERVER_PORT", "18080"

        ndk {
            if (targetAbi != null && targetAbi.toString().trim()) {
                abiFilters targetAbi.toString()
            } else {
                abiFilters 'armeabi-v7a', 'arm64-v8a'
            }
        }
    }

    signingConfigs {
        release {
            storeFile hasReleaseKeystore ? file(releaseKeystorePath) : null
            storePassword hasReleaseKeystore ? releaseKeystorePassword.toString() : null
            keyAlias hasReleaseKeystore ? releaseKeyAlias.toString() : null
            keyPassword hasReleaseKeystore ? releaseKeyPassword.toString() : null
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation files('libs/passworder-mobilebridge.aar')
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
